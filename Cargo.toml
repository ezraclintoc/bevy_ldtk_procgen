[package]
name = "bevy_ldtk_procgen"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Procedural dungeons for Bevy, streamed from rooms authored as LDtk levels"
repository = "https://github.com/ezraclintoc/bevy_ldtk_procgen"
readme = "README.md"
keywords = ["bevy", "ldtk", "procedural", "dungeon", "gamedev"]
categories = ["game-development", "game-engines"]
# The demo GIF and CI/Nix files are for the repo, not the crate. Assets stay:
# the examples load them.
exclude = ["/media", "/AGENTS.md", "/.github", "/flake.nix", "/flake.lock", "/.pre-commit-config.yaml"]

# examples/ are real build targets (autoexamples) and double as the
# executable form of this crate's documented API: `minimal` the output API,
# `halls` a player with wall collision, `meta` meta-generation, `testing`
# the debug harness.

[dependencies]
# Only what the library uses. Features are additive, so anything enabled here
# is forced on every consumer; the app brings the rest (rendering, windowing).
bevy = { version = "0.20.1", default-features = false, features = ["bevy_sprite", "bevy_log", "bevy_state"] }
bevy_ecs_ldtk = "0.16.0"
rand = "0.10.1"

[dev-dependencies]
serde_json = "1"
# Widgets for the `testing` example's debug menu. A dev-dependency, so the
# feature only reaches example and test builds, never the library's own.
bevy = { version = "0.20.1", features = ["bevy_feathers"] } # plus default features

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
indexing_slicing = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
modulo_arithmetic = "warn"
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
doc_markdown = "warn"
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "warn"
