[package]
name = "bevy_ldtk_procgen"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = {version="0.18.0", features=["pan_camera", "debug"] }
bevy_ecs_ldtk = "0.14.0"
rand = "0.10.1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
indexing_slicing = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
modulo_arithmetic = "warn"
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
doc_markdown = "warn"
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "warn"
