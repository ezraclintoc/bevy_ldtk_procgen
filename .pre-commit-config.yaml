repos:
  - repo: local
    hooks:
      - id: typos
        name: typos
        entry: typos
        language: system
        types: [text]

      - id: rustfmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features
        language: system
        types: [rust]
        pass_filenames: false
